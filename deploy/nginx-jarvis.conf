# Site nginx de Jarvis, à côté de celui de Manageo : /etc/nginx/sites-available/jarvis
# Remplacer jarvis.manageo.site par le sous-domaine choisi (enregistrement DNS A vers l'IP du VPS).
# Le bloc HTTPS est complété par certbot : sudo certbot --nginx -d jarvis.manageo.site

server {
    listen 80;
    listen [::]:80;
    server_name jarvis.manageo.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jarvis.manageo.site;

    ssl_certificate /etc/letsencrypt/live/jarvis.manageo.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jarvis.manageo.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Photos de factures et de vêtements, exports Santé, cours en PDF (jusqu'à 30 Mo).
    client_max_body_size 30m;

    # Limite les abus : 120 requêtes par minute et par adresse sur l'API (la web app en envoie une dizaine par écran).
    location /api/ {
        limit_req zone=jarvis_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Une demande à Jarvis peut enchaîner plusieurs appels à Claude.
        proxy_read_timeout 180s;
    }

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Zone de limitation, à déclarer une seule fois (hors des blocs server).
limit_req_zone $binary_remote_addr zone=jarvis_api:10m rate=120r/m;
